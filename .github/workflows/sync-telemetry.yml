name: Sync Core Telemetry & Stats

on:
  schedule:
    # Automatically runs every 6 hours to sync contributions, commits, and streaks
    - cron: '0 */6 * * *'
  push:
    branches:
      - main
    paths:
      - '.github/scripts/sync_telemetry.py'
      - '.github/workflows/sync-telemetry.yml'
  workflow_dispatch: # Allows 1-click manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  sync-telemetry:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch Live Stats & Generate Telemetry Card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
        run: |
          python .github/scripts/sync_telemetry.py

      - name: Deploy Telemetry Card to Orphan Branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          BLOB=$(git hash-object -w assets/telemetry-cosmos-card-v11.svg)
          TREE=$(printf "100644 blob %s\ttelemetry-cosmos-card-v11.svg\n" "$BLOB" | git mktree)
          COMMIT=$(git commit-tree "$TREE" -m "chore(telemetry): auto-sync live stats [skip ci]")
          git push origin "$COMMIT":refs/heads/gh-pages --force
